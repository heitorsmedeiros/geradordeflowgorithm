<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador Rápido .fprg</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for textarea */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: #f1f5f9; 
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen p-4 md:p-8 flex items-center justify-center">

    <div class="max-w-3xl w-full bg-white rounded-xl shadow-lg overflow-hidden border border-gray-100 transition-all hover:shadow-xl">
        
        <!-- Header Section -->
        <div class="bg-blue-600 p-6 text-white">
            <div class="flex items-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-100" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
                </svg>
                <h1 class="text-2xl font-bold tracking-tight">Gerador de Flowgorithm (.fprg)</h1>
            </div>
            <p class="text-blue-100 mt-2 text-sm opacity-90">Cole o código XML abaixo e converta-o instantaneamente para um arquivo executável do Flowgorithm.</p>
        </div>

        <div class="p-6 md:p-8">
            <div class="mb-4">
                <label for="codigoXml" class="block text-sm font-semibold text-gray-700 mb-2 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                    Código XML
                </label>
                <div class="relative">
                    <textarea 
                        id="codigoXml" 
                        class="w-full h-80 p-4 font-mono text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-gray-50 resize-y shadow-inner outline-none transition-all duration-200"
                        placeholder="&lt;?xml version='1.0'?&gt;&#10;&lt;flowgorithm fileversion='4.2'&gt;&#10;    &lt;!-- Cole o código do fluxograma aqui... --&gt;&#10;&lt;/flowgorithm&gt;"
                        spellcheck="false"
                        oninput="validarConteudo()"
                    ></textarea>
                    <button id="clearBtn" onclick="limparTexto()" class="absolute top-2 right-2 p-1.5 bg-gray-200 text-gray-600 rounded hover:bg-gray-300 hover:text-gray-800 transition-colors hidden" title="Limpar código">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="flex flex-col md:flex-row gap-4 mt-6">
                <div class="flex-[2]">
                    <label for="nomeArquivo" class="block text-sm font-semibold text-gray-700 mb-2">Nome do Arquivo</label>
                    <div class="relative flex items-center">
                        <input 
                            type="text" 
                            id="nomeArquivo" 
                            class="w-full p-3 border border-gray-300 rounded-l-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-shadow text-gray-800"
                            placeholder="Exercicio_1"
                            value="Exercicio_1"
                        >
                        <span class="px-4 py-3 bg-gray-100 border-y border-r border-gray-300 rounded-r-lg text-gray-500 font-mono text-sm shadow-sm select-none">
                            .fprg
                        </span>
                    </div>
                </div>

                <div class="flex-1 flex items-end">
                    <button 
                        id="downloadBtn"
                        onclick="baixarFprg()" 
                        class="w-full h-[46px] bg-green-600 hover:bg-green-700 disabled:bg-gray-400 disabled:cursor-not-allowed text-white font-bold rounded-lg shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-2"
                        disabled
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                        </svg>
                        <span>Baixar Arquivo</span>
                    </button>
                </div>
            </div>
            
            <div id="statusAlert" class="mt-5 hidden p-4 rounded-lg flex items-start gap-3 transition-all duration-300 transform translate-y-2 opacity-0 shadow-sm border">
                <div id="statusIcon" class="flex-shrink-0"></div>
                <div>
                    <h3 id="statusTitle" class="text-sm font-bold"></h3>
                    <p id="statusMessage" class="text-sm mt-1"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showStatus(type, title, message) {
            const alertBox = document.getElementById('statusAlert');
            const iconBox = document.getElementById('statusIcon');
            const titleBox = document.getElementById('statusTitle');
            const messageBox = document.getElementById('statusMessage');

            alertBox.classList.remove('hidden', 'bg-red-50', 'text-red-800', 'bg-green-50', 'text-green-800', 'border-red-200', 'border-green-200', 'translate-y-2', 'opacity-0');
            alertBox.classList.add('border', 'translate-y-0', 'opacity-100');

            if (type === 'error') {
                alertBox.classList.add('bg-red-50', 'text-red-900', 'border-red-200');
                iconBox.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>`;
            } else if (type === 'success') {
                alertBox.classList.add('bg-green-50', 'text-green-900', 'border-green-200');
                iconBox.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`;
            }

            titleBox.innerText = title;
            messageBox.innerText = message;
            
            // Auto hide after 5 seconds
            setTimeout(() => {
                alertBox.classList.remove('translate-y-0', 'opacity-100');
                alertBox.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => alertBox.classList.add('hidden'), 300); // Wait for transition
            }, 5000);
        }

        function validarConteudo() {
            const codigo = document.getElementById('codigoXml').value.trim();
            const btn = document.getElementById('downloadBtn');
            const clearBtn = document.getElementById('clearBtn');
            
            // Show clear button if there's text
            if (codigo.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }

            // Enable download button only if it looks like XML
            if (codigo.length > 10 && (codigo.includes('<?xml') || codigo.includes('<flowgorithm'))) {
                btn.removeAttribute('disabled');
                btn.classList.add('hover:-translate-y-0.5'); // Small hover lift
            } else {
                btn.setAttribute('disabled', 'true');
                btn.classList.remove('hover:-translate-y-0.5');
            }
        }

        function limparTexto() {
            const textarea = document.getElementById('codigoXml');
            textarea.value = '';
            textarea.focus();
            validarConteudo();
        }

        function baixarFprg() {
            let codigo = document.getElementById('codigoXml').value.trim();
            let nome = document.getElementById('nomeArquivo').value.trim();
            
            if (!codigo) {
                showStatus('error', 'Código ausente', 'Por favor, cole o código XML do Flowgorithm no campo acima antes de baixar.');
                return;
            }

            // Basic validation to check if it looks like XML
            if (!codigo.includes('<?xml') && !codigo.includes('<flowgorithm')) {
                 showStatus('error', 'Formato Inválido', 'O código colado não parece ser um XML válido do Flowgorithm.');
                 return;
            }

            if (!nome) {
                nome = "exercicio";
            }

            // Remove existing .fprg extension if user typed it, to avoid .fprg.fprg
            nome = nome.replace(/\.fprg$/i, '');
            nome += '.fprg';

            try {
                // Creates a Blob containing the text data
                const blob = new Blob([codigo], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                
                // Create a temporary anchor element to trigger the download
                const a = document.createElement('a');
                a.href = url;
                a.download = nome;
                a.style.display = 'none';
                
                document.body.appendChild(a);
                a.click();
                
                // Cleanup
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                showStatus('success', 'Sucesso!', `Arquivo ${nome} baixado. Abra-o no Flowgorithm para testar.`);
            } catch (e) {
                showStatus('error', 'Erro no Download', 'Ocorreu um erro ao tentar criar o arquivo. Tente novamente.');
                console.error("Erro ao gerar arquivo: ", e);
            }
        }
    </script>
</body>
</html>
